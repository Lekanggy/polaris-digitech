<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbital hero loop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
  }
  body { display: grid; place-items: center; min-height: 100vh; }

  .stage {
    position: relative;
    width: 100%;
    max-width: 100vw;
    /* On wide screens preserve the native aspect ratio;
       on narrow/tall screens (mobile) fill the full viewport height. */
    aspect-ratio: 1536 / 825;
    min-height: 100vh;
    overflow: hidden;
    background: #000;
  }

  /* static plate: starfield, atmosphere rim, horizon curve */
  .plate {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* scrolling, curve-warped surface */
  #surface {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: .94;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
  }

  .sky { position: absolute; inset: 0; pointer-events: none; }

  .star {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    transform: translate(-50%, -50%);
    will-change: opacity, transform;
    animation: twinkle var(--dur) ease-in-out infinite alternate;
    animation-delay: var(--delay);
  }

  @keyframes twinkle {
    from { opacity: .18; transform: translate(-50%, -50%) scale(.72); }
    to   { opacity: 1;   transform: translate(-50%, -50%) scale(1.18); }
  }

  @media (prefers-reduced-motion: reduce) {
    .star { animation: none; opacity: .55; }
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="plate" id="plate" alt="Earth seen from low orbit, city lights along the night side">
    <canvas id="surface"></canvas>
    <div class="sky" id="sky"></div>
  </div>

const SECONDS_PER_PASS = 52;   // slower = calmer. one seamless pass of the tile
const SLICE = 2;               // px per warp column
const FADE  = 42;              // px feather where the surface meets the rim

document.getElementById('plate').src = BASE_SRC;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv  = document.getElementById('surface');
const ctx = cv.getContext('2d');
cv.width = CFG.W; cv.height = CFG.H;

// alpha ramp used to feather the top edge of every warped slice
const fade = document.createElement('canvas');
fade.width = 1; fade.height = FADE;
{
  const fx = fade.getContext('2d');
  const g = fx.createLinearGradient(0, 0, 0, FADE);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  fx.fillStyle = g;
  fx.fillRect(0, 0, 1, FADE);
}

const strip = new Image();
strip.onload = () => reduce ? draw(0) : requestAnimationFrame(loop);
strip.src = STRIP_SRC;

// limb height at any x, sampled every 2px in CFG.limb
function limbAt(x) {
  const i = Math.min(CFG.limb.length - 1, Math.round(x / 2));
  return CFG.limb[i];
}

function draw(offset) {
  ctx.clearRect(0, 0, CFG.W, CFG.H);
  const wrap = offset % CFG.UW;

  ctx.globalCompositeOperation = 'source-over';
  for (let x = 0; x < CFG.W; x += SLICE) {
    const dy = limbAt(x) + CFG.INSET;
    const dh = CFG.H - dy;
    if (dh <= 1) continue;
    // +1px of destination overlap keeps the columns from showing hairlines
    ctx.drawImage(strip, wrap + x, 0, SLICE, CFG.SH, x, dy, SLICE, dh);
  }

  ctx.globalCompositeOperation = 'destination-out';
  for (let x = 0; x < CFG.W; x += SLICE) {
    const dy = limbAt(x) + CFG.INSET;
    if (CFG.H - dy <= 1) continue;
    ctx.drawImage(fade, x, dy, SLICE, FADE);
  }
  ctx.globalCompositeOperation = 'source-over';
}

const speed = CFG.UW / SECONDS_PER_PASS;   // px per second
let last = 0;
const FRAME_MS = 1000 / 30;                // ambient drift, 30fps is plenty
function loop(t) {
  if (t - last >= FRAME_MS) {
    last = t;
    draw((t / 1000) * speed % CFG.UW);
  }
  requestAnimationFrame(loop);
}

// place the glow on stars that are actually in the plate
const sky = document.getElementById('sky');
const frag = document.createDocumentFragment();
for (const s of CFG.stars) {
  const d = document.createElement('div');
  d.className = 'star';
  const size = 5 + s.v * 13;
  d.style.left = s.x + '%';
  d.style.top  = s.y + '%';
  d.style.width  = size + 'px';
  d.style.height = size + 'px';
  d.style.background =
    'radial-gradient(circle, ' + s.c + ' 0%, ' + s.c + '55 26%, transparent 68%)';
  d.style.setProperty('--dur',  (3.4 + Math.random() * 5.2).toFixed(2) + 's');
  d.style.setProperty('--delay', (-Math.random() * 8).toFixed(2) + 's');
  frag.appendChild(d);
}
sky.appendChild(frag);
